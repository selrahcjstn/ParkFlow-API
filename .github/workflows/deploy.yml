name: Deploy ParkFlow API to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time: two pushes in quick succession must not stop, purge and copy into the
# same server folder simultaneously. A newer push waits instead of cancelling a running deploy.
concurrency:
  group: deploy-parkflow-api
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Publish API Application
      run: |
        dotnet restore ParkFlow.API/ParkFlow.API.csproj
        dotnet publish ParkFlow.API/ParkFlow.API.csproj -c Release -r linux-x64 --self-contained true -o ./publish

    # Runs while the live service is still up. If the server cannot hold the new build, fail here
    # and leave the running version untouched instead of stopping it and then running out of space.
    - name: Free Disk Space and Verify Capacity
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 127 MB unpacked + 54 MB upload archive, with margin.
          NEEDED_MB=350
          echo "== Disk before cleanup"; df -h /
          sudo rm -rf /tmp/* /var/tmp/* || true
          # Rotate first so the active journal file becomes an archive that vacuum can remove.
          sudo journalctl --rotate || true
          sudo journalctl --vacuum-size=50M || true
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          echo "== Largest files in /var/log before cleanup"
          sudo find /var/log -type f -printf '%s %p\n' 2>/dev/null | sort -rn | head -10 | awk '{printf "%d MB  %s\n", $1/1048576, $2}'
          sudo find /var/log -type f \( -name '*.gz' -o -name '*.[0-9]' -o -name '*.old' -o -name '*.[0-9].log' \) -delete 2>/dev/null || true
          # /var/log held ~2.9 GB while no single file matched '*.log': syslog, kern.log, btmp, nginx and
          # app logs have other names. Empty any plain log over 20 MB regardless of name (journal excluded;
          # truncating in place keeps the file handle valid for the process that is writing it).
          sudo find /var/log -type f -size +20M ! -path '/var/log/journal/*' -exec truncate -s 0 {} \; 2>/dev/null || true
          # Last resort when logs are many small files: keep only the newest 3 days of anything outside the journal.
          sudo find /var/log -type f -mtime +3 ! -path '/var/log/journal/*' -exec truncate -s 0 {} \; 2>/dev/null || true
          if command -v snap >/dev/null 2>&1; then
            snap list --all 2>/dev/null | awk '/disabled/{print $1, $3}' | while read -r name rev; do sudo snap remove "$name" --revision="$rev" || true; done
          fi
          echo "== Disk after cleanup"; df -h /
          echo "== Largest directories (uploads under app/publish/App_Data and wwwroot are never deleted)"
          sudo du -xh / --max-depth=2 2>/dev/null | sort -rh | head -20
          AVAIL_MB=$(df --output=avail -m / | tail -1 | tr -d ' ')
          # Old binaries are deleted before the new ones are copied, so they count as reclaimable.
          OLD_MB=$(find /home/ubuntu/app/publish -maxdepth 1 -type f ! -name 'appsettings.Production.json' -printf '%s\n' 2>/dev/null | awk '{s+=$1} END {printf "%d", s/1048576}')
          echo "Free: ${AVAIL_MB} MB, reclaimable old binaries: ${OLD_MB:-0} MB, needed: ${NEEDED_MB} MB"
          if [ $((AVAIL_MB + ${OLD_MB:-0})) -lt "$NEEDED_MB" ]; then
            echo "::error::Not enough disk space on the server to deploy. The running service was NOT touched. See the directory list above for what is using the disk."
            exit 1
          fi

    - name: Stop Live Application Service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo systemctl stop parkflow || true

    - name: Purge Stale Application Binaries and Free Disk Space
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          mkdir -p /home/ubuntu/app/publish
          find /home/ubuntu/app/publish/ -maxdepth 1 -type f ! -name 'appsettings.Production.json' -delete
          rm -rf /home/ubuntu/app/releases || true
          sudo rm -rf /tmp/* /var/tmp/* || true
          sudo journalctl --rotate || true
          sudo journalctl --vacuum-size=50M || true
          sudo apt-get clean || true
          sudo find /var/log -type f -size +20M ! -path '/var/log/journal/*' -exec truncate -s 0 {} \; 2>/dev/null || true
          df -h

    - name: Deploy Fresh Binaries via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "./publish/*"
        target: "/home/ubuntu/app/publish"
        strip_components: 1

    - name: Initialize and Start Service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          chmod +x /home/ubuntu/app/publish/ParkFlow.API
          mkdir -p /home/ubuntu/app/publish/App_Data/private-uploads/parkflow/licenses
          mkdir -p /home/ubuntu/app/publish/wwwroot/uploads
          chmod -R 777 /home/ubuntu/app/publish/App_Data || true
          chmod -R 777 /home/ubuntu/app/publish/wwwroot || true
          sudo systemctl daemon-reload
          sudo systemctl restart parkflow
          sleep 3
          sudo systemctl is-active --quiet parkflow || (echo "Service failed to start! Recent logs:" && sudo journalctl -u parkflow -n 50 --no-pager && exit 1)
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:5000/swagger/v1/swagger.json || curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:5000/swagger/index.html || (echo "Failed to query Swagger on port 5000! Recent logs:" && sudo journalctl -u parkflow -n 50 --no-pager && exit 1)
