name: Deploy ParkFlow API to EC2

on:
  workflow_dispatch:
    inputs:
      release_approved:
        description: 'Approve this exact main commit for production release'
        required: true
        type: boolean
        default: false
      schema_reviewed:
        description: 'Required schema is separately applied and reviewed; no destructive cleanup is authorized'
        required: true
        type: boolean
        default: false
      client_compatibility_confirmed:
        description: 'Deployed admin/mobile clients are compatible with this API release'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: parkflow-production-deployment
  cancel-in-progress: false

jobs:
  release-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit release and schema approval
        env:
          RELEASE_APPROVED: ${{ inputs.release_approved }}
          SCHEMA_REVIEWED: ${{ inputs.schema_reviewed }}
          CLIENTS_COMPATIBLE: ${{ inputs.client_compatibility_confirmed }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$RELEASE_APPROVED" = 'true'
          test "$SCHEMA_REVIEWED" = 'true'
          test "$CLIENTS_COMPATIBLE" = 'true'

  verification:
    needs: release-approval
    uses: ./.github/workflows/verification.yml

  build-and-deploy:
    needs: [release-approval, verification]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Publish API Application
        run: |
          dotnet restore ParkFlow.API/ParkFlow.API.csproj -r linux-x64 -p:SelfContained=true
          dotnet publish ParkFlow.API/ParkFlow.API.csproj -c Release -r linux-x64 --self-contained true -o ./publish --no-restore

      - name: Stage verified binaries without stopping the live service
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: './publish/*'
          target: '/home/ubuntu/app/releases/${{ github.sha }}'
          strip_components: 1

      - name: Check target schema before replacing live binaries
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            release='/home/ubuntu/app/releases/${{ github.sha }}'
            config='/home/ubuntu/app/publish/appsettings.Production.json'
            if [ ! -s "$config" ]; then
              echo 'Production configuration is required for the staged schema preflight. Live service was not stopped.'
              exit 1
            fi
            cp "$config" "$release/appsettings.Production.json"
            chmod +x "$release/ParkFlow.API"
            cd "$release"
            ASPNETCORE_ENVIRONMENT=Production ./ParkFlow.API --check-database

      - name: Replace binaries and start service after successful preflight
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            release='/home/ubuntu/app/releases/${{ github.sha }}'
            cmp -s "$release/appsettings.Production.json" /home/ubuntu/app/publish/appsettings.Production.json
            sudo systemctl stop parkflow
            find /home/ubuntu/app/publish/ -maxdepth 1 -type f ! -name 'appsettings*.json' ! -name '.env' -delete
            cp -a "$release/." /home/ubuntu/app/publish/
            chmod +x /home/ubuntu/app/publish/ParkFlow.API
            sudo systemctl daemon-reload
            sudo systemctl start parkflow
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 --header 'X-Forwarded-Proto: https' http://127.0.0.1:5000/swagger/v1/swagger.json > /dev/null
            sudo systemctl is-active --quiet parkflow
            sudo systemctl status parkflow --no-pager -l
