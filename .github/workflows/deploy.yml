name: Deploy ParkFlow API to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "==> Pulling latest code..."
            cd ~/ParkFlow-API
            git pull origin main

            echo "==> Stopping existing dotnet process..."
            pkill -f "dotnet" || true
            sleep 3

            echo "==> Starting API in background..."
            nohup dotnet run --project ParkFlow.API/ParkFlow.API.csproj > ~/api.log 2>&1 &

            echo "==> Waiting for API to boot..."
            sleep 20

            echo "==> Checking if running..."
            pgrep -f "dotnet" && echo "API is running!" || echo "WARNING: dotnet not found in process list"
