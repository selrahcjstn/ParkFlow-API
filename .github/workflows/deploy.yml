name: Deploy ParkFlow API to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest code and restart API on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo ">>> Pulling latest code..."
            cd ~/ParkFlow-API
            git pull origin main

            echo ">>> Stopping existing API process..."
            pkill -f "dotnet" || true
            sleep 3

            echo ">>> Starting API..."
            nohup dotnet run --project ParkFlow.API/ParkFlow.API.csproj > ~/api.log 2>&1 &

            sleep 5
            echo ">>> Deploy complete. Check logs: tail -f ~/api.log"
